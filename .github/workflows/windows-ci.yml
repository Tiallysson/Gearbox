name: Windows validation

on:
  push:
    branches: [fix/review-stability-2026-10-27]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Compilar solution (x64)
        run: dotnet build Gearbox.sln -c Release -p:Platform=x64
      - name: Executar testes de regressão
        run: dotnet test --solution Gearbox.sln -c Release --no-build --minimum-expected-tests 1
      - name: Gerar aplicativo para teste manual
        run: dotnet publish src/Gearbox/Gearbox.csproj -c Release -r win-x64 --self-contained true -o artifacts/Gearbox-win-x64
      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Gearbox-review-win-x64
          path: artifacts/Gearbox-win-x64/
          if-no-files-found: error
          retention-days: 14
